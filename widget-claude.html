<!DOCTYPE html>
<html lang="en" data-surface="claude">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Usage</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/ui.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: linear-gradient(160deg, var(--c-grad, #1c1512) 0%, var(--c-bg, #121014) 60%);
      color: var(--c-text, #f5f0ec);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; user-select: none;
    }
    #wrap { height: 100%; display: flex; flex-direction: column; padding: 10px 16px 8px; gap: 6px; }
    #model { font-size: 10px; color: var(--c-muted, #7d7068); }

    /* Hero row */
    .hero { display: flex; align-items: baseline; gap: 14px; flex-shrink: 0; }
    #hero-tok { font-size: clamp(26px, 6vw, 42px); font-weight: 200; letter-spacing: -.02em; line-height: 1; }
    .hero-sub { font-size: 12px; color: var(--c-sub, #b8a99e); }
    .hero-sub b { color: var(--c-text, #f5f0ec); font-weight: 600; }

    /* Small stat tiles */
    .tiles { display: flex; gap: 8px; flex-shrink: 0; }
    .tile { flex: 1; background: var(--c-card, rgba(255,255,255,.045)); border: 1px solid var(--c-card-line, transparent); border-radius: 8px; padding: 6px 10px; min-width: 0; }
    .tile .t-v { font-size: 15px; font-weight: 600; white-space: nowrap; }
    .tile .t-l { font-size: 9.5px; color: var(--c-sub, #b8a99e); text-transform: uppercase; letter-spacing: .06em; margin-top: 1px; white-space: nowrap; }

    /* 7-day bars */
    #chart { flex: 1; min-height: 34px; display: flex; align-items: flex-end; gap: 6px; padding-top: 6px; }
    .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; min-width: 0; }
    .bar-wrap { width: 100%; flex: 1; display: flex; align-items: flex-end; justify-content: center; }
    .bar {
      width: 70%; max-width: 34px; min-height: 2px;
      background: var(--c-accent-dim, rgba(217,119,87,.55)); border-radius: 4px 4px 0 0;
    }
    .col.today .bar { background: var(--c-accent, #d97757); }
    .d-label { font-size: 9px; color: var(--c-muted, #7d7068); }
    .col.today .d-label { color: var(--c-sub, #b8a99e); font-weight: 700; }
    .d-val { font-size: 9px; color: var(--c-sub, #b8a99e); height: 11px; }

    #empty { flex: 1; display: flex; align-items: center; color: var(--c-sub, #b8a99e); font-size: 13px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="head">
      <div class="chip">✳</div>
      <div class="label">Claude usage</div>
      <div class="spacer"></div>
      <div id="model"></div>
      <button class="btn btn--quiet btn--icon btn--sm btn--round" id="refresh" aria-label="Refresh">↻</button>
    </div>

    <div id="content" style="display:none; flex:1; min-height:0; display:flex; flex-direction:column; gap:6px;">
      <div class="hero">
        <div id="hero-tok">—</div>
        <div class="hero-sub">tokens today · <b id="hero-cost"></b> est. value</div>
      </div>
      <div class="tiles">
        <div class="tile"><div class="t-v" id="t-msgs">—</div><div class="t-l">msgs today</div></div>
        <div class="tile"><div class="t-v" id="t-sess">—</div><div class="t-l">sessions</div></div>
        <div class="tile"><div class="t-v" id="t-month">—</div><div class="t-l">this month</div></div>
        <div class="tile"><div class="t-v" id="t-all">—</div><div class="t-l">all time</div></div>
      </div>
      <div id="chart"></div>
    </div>
    <div id="empty" style="display:none">No Claude Code usage found on this machine yet.</div>

    <div class="foot">local Claude Code stats · updates itself · costs nothing</div>
  </div>

  <script>
    function fmtTok(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
      return String(n);
    }
    function fmtCost(n) {
      return "$" + (n >= 100 ? Math.round(n) : n.toFixed(2));
    }

    async function load() {
      try {
        const res = await fetch("/api/claude-stats");
        const d = await res.json();
        const content = document.getElementById("content");
        const empty = document.getElementById("empty");
        if (!d.ok) {
          content.style.display = "none";
          empty.style.display = "flex";
          return;
        }
        content.style.display = "flex";
        empty.style.display = "none";

        document.getElementById("hero-tok").textContent = fmtTok(d.today.tok);
        document.getElementById("hero-cost").textContent = fmtCost(d.today.cost);
        document.getElementById("t-msgs").textContent = d.today.msgs.toLocaleString();
        document.getElementById("t-sess").textContent = d.today.sessions;
        document.getElementById("t-month").textContent = fmtTok(d.month.tok);
        document.getElementById("t-all").textContent = fmtTok(d.allTime.tok);
        document.getElementById("model").textContent = d.topModel ? "mostly " + d.topModel : "";

        const chart = document.getElementById("chart");
        chart.innerHTML = "";
        const max = Math.max(1, ...d.days.map((x) => x.tok));
        for (const day of d.days) {
          const col = document.createElement("div");
          col.className = "col" + (day.label === "Today" ? " today" : "");
          col.title = day.date + " — " + fmtTok(day.tok) + " tokens · " + fmtCost(day.cost);
          const pct = Math.round((day.tok / max) * 100);
          col.innerHTML =
            '<div class="d-val">' + (day.label === "Today" && day.tok ? fmtTok(day.tok) : "") + "</div>" +
            '<div class="bar-wrap"><div class="bar" style="height:' + pct + '%"></div></div>' +
            '<div class="d-label">' + day.label + "</div>";
          chart.appendChild(col);
        }
      } catch (e) {
        document.getElementById("empty").textContent = "Couldn't reach the local server.";
        document.getElementById("empty").style.display = "flex";
        document.getElementById("content").style.display = "none";
      }
    }

    document.getElementById("refresh").addEventListener("click", load);
    load();
    setInterval(load, 60 * 1000); // live-ish: refresh every minute
  </script>
</body>
</html>
