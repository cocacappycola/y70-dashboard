<!DOCTYPE html>
<html lang="en" data-surface="tools">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/ui.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: linear-gradient(160deg, var(--u-grad, #22200f) 0%, var(--u-bg, #101014) 60%);
      color: var(--u-text, #f5f2e6);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; user-select: none;
    }
    #wrap { height: 100%; display: flex; flex-direction: column; padding: 10px 14px 8px; gap: 8px; }

    .presets { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }

    /* ---- Running timers ---- */
    #list { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .tm {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-md);
      background: var(--u-card, rgba(255,255,255,.05));
      border: 1px solid var(--u-card-line, rgba(255,255,255,.1));
      position: relative; overflow: hidden; flex-shrink: 0;
    }
    /* The remaining time drawn straight into the row. */
    .tm .bg { position: absolute; inset: 0; width: 0%; background: var(--u-accent-soft, rgba(232,212,77,.13)); transition: width .3s linear; }
    .tm > * { position: relative; }
    .tm .t-left { font-size: clamp(18px, 4vh, 30px); font-weight: 200; letter-spacing: -.02em; font-variant-numeric: tabular-nums; min-width: 92px; }
    .tm .t-name { flex: 1; min-width: 0; font-size: 12px; color: var(--u-sub, #b0aa8e); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tm.paused .t-left { color: var(--u-muted, #7d7960); }
    .tm.done {
      background: var(--u-accent-soft, rgba(232,212,77,.16));
      border-color: var(--u-accent-line, rgba(232,212,77,.45));
    }
    .tm.done .t-left { color: var(--u-accent, #e8d44d); }

    #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--u-muted, #7d7960); font-size: 12.5px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="head">
      <div class="chip">⏱</div>
      <div class="label">Timer</div>
      <div class="spacer"></div>
      <button class="btn btn--chip is-on" id="silence" style="display:none">Silence</button>
    </div>

    <div class="presets" id="presets"></div>

    <div id="list" class="scroll-y"></div>
    <div id="empty">No timers running.</div>

    <div class="foot">timers keep running with the panel closed · tap ⏸ to hold</div>
  </div>

  <script>
    const $ = (s) => document.getElementById(s);
    const KEY = "y70_timers";
    const PRESETS = [
      { s: 60, label: "1m" }, { s: 180, label: "3m" }, { s: 300, label: "5m" },
      { s: 600, label: "10m" }, { s: 900, label: "15m" }, { s: 1500, label: "25m", name: "Pomodoro" },
      { s: 3600, label: "1h" },
    ];

    // A timer is stored as an absolute end time, never a countdown that has to
    // be ticked — so it stays correct across a reload, a collapsed panel, or a
    // browser that throttled our timers while hidden.
    let timers = [];
    try { timers = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { timers = []; }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(timers)); } catch (e) {} };

    let audioCtx = null, ringing = false, ringTimer = null;
    function beep() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const t = audioCtx.currentTime;
        for (let i = 0; i < 3; i++) {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = "sine";
          o.frequency.value = 880;
          g.gain.setValueAtTime(0, t + i * 0.34);
          g.gain.linearRampToValueAtTime(0.22, t + i * 0.34 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.34 + 0.3);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(t + i * 0.34); o.stop(t + i * 0.34 + 0.32);
        }
      } catch (e) { /* no audio permission yet — the row still flashes */ }
    }

    function add(seconds, name) {
      timers.push({
        id: "t" + Date.now() + Math.random().toString(36).slice(2, 6),
        name: name || fmtDur(seconds),
        total: seconds * 1000,
        endsAt: Date.now() + seconds * 1000,
        pausedLeft: null,
        fired: false,
      });
      save(); render();
    }
    const remove = (id) => { timers = timers.filter((t) => t.id !== id); save(); render(); };
    function togglePause(id) {
      const t = timers.find((x) => x.id === id);
      if (!t) return;
      if (t.pausedLeft == null) t.pausedLeft = Math.max(0, t.endsAt - Date.now());
      else { t.endsAt = Date.now() + t.pausedLeft; t.pausedLeft = null; }
      save(); render();
    }

    const left = (t) => (t.pausedLeft != null ? t.pausedLeft : Math.max(0, t.endsAt - Date.now()));
    function fmtLeft(ms) {
      const s = Math.ceil(ms / 1000);
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      if (h) return h + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
      return m + ":" + String(sec).padStart(2, "0");
    }
    function fmtDur(s) {
      if (s >= 3600) return (s / 3600) + "h";
      if (s >= 60) return (s / 60) + "m";
      return s + "s";
    }

    function renderPresets() {
      const box = $("presets");
      box.innerHTML = "";
      for (const p of PRESETS) {
        const b = document.createElement("button");
        b.className = "btn btn--chip";
        b.textContent = p.label;
        b.addEventListener("pointerup", () => { beepUnlock(); add(p.s, p.name); });
        box.appendChild(b);
      }
    }

    // Browsers won't make sound until a gesture; the first tap unlocks it so the
    // alarm can actually ring later.
    function beepUnlock() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
    }

    function render() {
      const list = $("list");
      $("empty").style.display = timers.length ? "none" : "flex";
      const sig = timers.map((t) => t.id).join("|");
      if (list.dataset.sig !== sig) {
        list.dataset.sig = sig;
        list.innerHTML = "";
        for (const t of timers) {
          const el = document.createElement("div");
          el.className = "tm";
          el.dataset.id = t.id;
          el.innerHTML =
            '<div class="bg"></div>' +
            '<div class="t-left">0:00</div>' +
            '<div class="t-name"></div>' +
            '<button class="btn btn--quiet btn--sm btn--icon b-pause">⏸</button>' +
            '<button class="btn btn--quiet btn--sm btn--icon b-del">✕</button>';
          el.querySelector(".t-name").textContent = t.name;
          el.querySelector(".b-pause").addEventListener("pointerup", () => togglePause(t.id));
          el.querySelector(".b-del").addEventListener("pointerup", () => remove(t.id));
          list.appendChild(el);
        }
      }
      tick();
    }

    function tick() {
      let anyDone = false;
      for (const t of timers) {
        const el = $("list").querySelector('.tm[data-id="' + t.id + '"]');
        if (!el) continue;
        const ms = left(t);
        const done = ms <= 0;
        el.querySelector(".t-left").textContent = done ? "0:00" : fmtLeft(ms);
        el.querySelector(".bg").style.width = (100 - Math.min(100, (ms / t.total) * 100)).toFixed(1) + "%";
        el.classList.toggle("paused", t.pausedLeft != null);
        el.classList.toggle("done", done);
        el.querySelector(".b-pause").textContent = t.pausedLeft != null ? "▶" : "⏸";
        if (done) {
          anyDone = true;
          if (!t.fired) { t.fired = true; save(); startRinging(); }
        }
      }
      $("silence").style.display = anyDone ? "block" : "none";
      if (!anyDone) stopRinging();
    }

    function startRinging() {
      if (ringing) return;
      ringing = true;
      beep();
      // Repeat until acknowledged, but not forever — two minutes is plenty.
      let n = 0;
      ringTimer = setInterval(() => { if (++n > 40) return stopRinging(); beep(); }, 3000);
    }
    function stopRinging() {
      ringing = false;
      if (ringTimer) clearInterval(ringTimer);
      ringTimer = null;
    }

    $("silence").addEventListener("pointerup", () => {
      timers = timers.filter((t) => left(t) > 0);
      stopRinging(); save(); render();
    });

    renderPresets();
    render();
    setInterval(tick, 250);
  </script>
</body>
</html>
