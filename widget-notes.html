<!DOCTYPE html>
<html lang="en" data-surface="tools">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/ui.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: linear-gradient(160deg, var(--u-grad, #22200f) 0%, var(--u-bg, #101014) 60%);
      color: var(--u-text, #f5f2e6);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #wrap { height: 100%; display: flex; flex-direction: column; padding: 10px 12px 8px; gap: 6px; }
    .head { user-select: none; }

    #pad {
      flex: 1; min-height: 0; width: 100%; resize: none;
      background: var(--u-card, rgba(255,255,255,.04));
      border: 1px solid var(--u-card-line, rgba(255,255,255,.09));
      border-radius: var(--r-md); padding: 10px 12px;
      color: var(--u-text, #f5f2e6); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 13px; line-height: 1.55; outline: none;
      -webkit-user-select: text; user-select: text;
    }
    #pad:focus { border-color: var(--u-accent-line, rgba(232,212,77,.45)); }
    #pad::placeholder { color: var(--u-muted, #7d7960); }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="head">
      <div class="chip">✎</div>
      <div class="label">Notes</div>
      <div class="spacer"></div>
      <div class="note" id="status">…</div>
      <button class="btn btn--ghost btn--sm" id="stamp">＋ date</button>
    </div>
    <textarea id="pad" class="scroll-y" placeholder="Type anything. It saves itself to notes.txt in the dashboard’s data folder." spellcheck="false"></textarea>
  </div>

  <script>
    const pad = document.getElementById("pad");
    const status = document.getElementById("status");
    let saved = "";        // what the server currently holds
    let saveTimer = null;
    let loaded = false;

    function setStatus(s) { status.textContent = s; }

    async function load() {
      try {
        const d = await (await fetch("/api/notes")).json();
        // Never clobber something the user has already started typing.
        if (!loaded || (pad.value === saved && d.text !== saved)) {
          const keepStart = pad.selectionStart, keepEnd = pad.selectionEnd;
          pad.value = d.text || "";
          if (loaded) { try { pad.setSelectionRange(keepStart, keepEnd); } catch (e) {} }
        }
        saved = d.text || "";
        loaded = true;
        setStatus(saved ? "saved" : "empty");
      } catch (e) {
        setStatus("offline");
      }
    }

    async function save() {
      const text = pad.value;
      if (text === saved) { setStatus("saved"); return; }
      setStatus("saving…");
      try {
        const r = await (await fetch("/api/notes", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        })).json();
        if (r.ok) { saved = text; setStatus("saved"); }
        else setStatus("save failed");
      } catch (e) { setStatus("offline — not saved"); }
    }

    // Debounced so a burst of typing costs one write, with a hard flush on blur
    // and on the way out so nothing is lost if the panel is closed mid-sentence.
    pad.addEventListener("input", () => {
      setStatus("editing…");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 800);
    });
    // In the V2 shell the window is deliberately non-focusable, so keystrokes
    // don't reach it. Tapping into the pad borrows the keyboard for as long as
    // you are typing, and gives it straight back — the panel is passive again
    // the moment you tap away.
    function askKeyboard(on) {
      try { window.parent.postMessage({ type: "y70:keyboard", on }, "*"); } catch (e) {}
    }
    pad.addEventListener("focus", () => askKeyboard(true));
    pad.addEventListener("blur", () => { askKeyboard(false); clearTimeout(saveTimer); save(); });
    window.addEventListener("pagehide", () => {
      if (pad.value === saved) return;
      // Fire-and-forget on teardown; fetch would be cancelled.
      try {
        navigator.sendBeacon("/api/notes", new Blob([JSON.stringify({ text: pad.value })], { type: "application/json" }));
      } catch (e) {}
    });

    document.getElementById("stamp").addEventListener("pointerup", () => {
      const d = new Date();
      const stamp = d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) +
        " " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      const at = pad.selectionStart ?? pad.value.length;
      const pre = pad.value.slice(0, at), post = pad.value.slice(at);
      const insert = (pre && !pre.endsWith("\n") ? "\n" : "") + "— " + stamp + "\n";
      pad.value = pre + insert + post;
      pad.focus();
      pad.setSelectionRange(pre.length + insert.length, pre.length + insert.length);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 400);
    });

    load();
    // Picks up edits made in an editor, but only while you are not typing.
    setInterval(() => { if (document.activeElement !== pad) load(); }, 10000);
  </script>
</body>
</html>
