<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now playing</title>
  <script src="/theme.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: var(--t-bg, #000); color: var(--t-text, #fff);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; user-select: none;
    }
    #bar { height: 100%; display: flex; flex-direction: column; }

    .row { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 12px; min-height: 0; }
    #art {
      width: 38px; height: 38px; border-radius: 4px; object-fit: cover;
      background: var(--t-surface-2, #242424); flex-shrink: 0;
    }
    .meta { min-width: 0; flex: 1; }
    #title {
      font-size: 13px; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; line-height: 1.25;
    }
    #artist {
      font-size: 11px; color: var(--t-sub, #b3b3b3); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; line-height: 1.25;
    }
    .ctl {
      background: transparent; border: none; color: var(--t-sub, #b3b3b3); cursor: pointer;
      width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .ctl:active { color: var(--t-text, #fff); transform: scale(.9); }
    #play {
      background: var(--t-accent, #fff); color: var(--t-accent-ink, #000); width: 38px; height: 38px;
    }
    #play:active { background: var(--t-accent-dim, #e0e0e0); }

    /* Seek strip pinned to the bottom edge */
    #seek { height: 5px; position: relative; cursor: pointer; touch-action: none; flex-shrink: 0; }
    #seek::before { content: ""; position: absolute; inset: 0; background: var(--t-line, #333); }
    #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--t-accent, #1ed760); }
    #seek:active #fill { background: var(--t-accent, #1ed760); }
    .times {
      position: absolute; right: 8px; bottom: 7px; font-size: 9px; color: var(--t-muted, #6a6a6a);
      font-variant-numeric: tabular-nums; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="bar">
    <div class="row">
      <img id="art" alt="" style="visibility:hidden" onerror="this.style.visibility='hidden'" />
      <div class="meta">
        <div id="title">Nothing playing</div>
        <div id="artist">—</div>
      </div>
      <button id="prev" class="ctl" aria-label="Previous">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="play" class="ctl" aria-label="Play/Pause"></button>
      <button id="next" class="ctl" aria-label="Next">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6h-2z"/></svg>
      </button>
      <span class="times" id="times"></span>
    </div>
    <div id="seek"><div id="fill"></div></div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const PLAY = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const PAUSE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    let st = { playing: false, position: 0, duration: 0, at: Date.now() };

    const send = (action, extra) =>
      window.parent.postMessage(Object.assign({ type: "y70:cmd", action }, extra || {}), "*");

    const fmt = (ms) => {
      const s = Math.floor(Math.max(0, ms) / 1000);
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    };

    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || d.type !== "y70:state") return;
      st = d;
      $("#title").textContent = d.title || "Nothing playing";
      $("#artist").textContent = d.artist || "—";
      const art = $("#art");
      if (d.art) { if (art.dataset.src !== d.art) { art.dataset.src = d.art; art.src = d.art; } art.style.visibility = "visible"; }
      else { art.removeAttribute("src"); art.dataset.src = ""; art.style.visibility = "hidden"; }
      $("#play").innerHTML = d.playing ? PAUSE : PLAY;
    });

    // Interpolate between the 1/sec updates so the bar moves smoothly.
    setInterval(() => {
      if (!st.duration) return;
      let pos = st.position + (st.playing ? Date.now() - st.at : 0);
      pos = Math.max(0, Math.min(pos, st.duration));
      $("#fill").style.width = (pos / st.duration) * 100 + "%";
      $("#times").textContent = fmt(pos) + " / " + fmt(st.duration);
    }, 250);

    $("#play").addEventListener("click", () => send("toggle"));
    $("#next").addEventListener("click", () => send("next"));
    $("#prev").addEventListener("click", () => send("prev"));
    $("#seek").addEventListener("pointerdown", (e) => {
      const r = $("#seek").getBoundingClientRect();
      send("seek", { ratio: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) });
    });

    $("#play").innerHTML = PLAY;
  </script>
</body>
</html>
